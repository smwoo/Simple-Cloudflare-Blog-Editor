{{- /*
  Applies the reader's saved light/dark choice before the body paints, so the
  page never flashes the other theme. With no saved choice the CSS follows
  the system setting.
*/ -}}
<script>
(function () {
  try {
    var t = localStorage.getItem('theme')
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
  } catch (e) {}
})()
</script>
