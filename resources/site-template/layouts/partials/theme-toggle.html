{{- /* Hidden until the script runs: without JavaScript it could do nothing. */ -}}
<button class="theme" type="button" hidden></button>
<script>
(function () {
  var root = document.documentElement
  var btn = document.currentScript.previousElementSibling
  var system = window.matchMedia('(prefers-color-scheme: dark)')
  var sun = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'
  var moon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>'
  function current() { return root.getAttribute('data-theme') || (system.matches ? 'dark' : 'light') }
  function render() {
    var dark = current() === 'dark'
    btn.innerHTML = dark ? sun : moon
    btn.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode')
    btn.title = btn.getAttribute('aria-label')
  }
  btn.addEventListener('click', function () {
    var next = current() === 'dark' ? 'light' : 'dark'
    root.setAttribute('data-theme', next)
    try { localStorage.setItem('theme', next) } catch (e) {}
    render()
  })
  if (system.addEventListener) system.addEventListener('change', render)
  render()
  btn.hidden = false
})()
</script>
