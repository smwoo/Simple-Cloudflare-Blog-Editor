name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      # The ffmpeg/Hugo tests need the real binaries, not whatever is on PATH.
      - run: node scripts/fetch-binaries.mjs
      # Media tests that need the reference library skip automatically; the
      # serializer and site tests always run.
      - run: npm test

  package:
    # Cross-compiling is a dead end here: Windows installers built on macOS hit
    # wine friction, and macOS notarization only runs on macOS. One job per host.
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin
            arches: arm64 x64
            cmd: pack:mac
          - os: windows-latest
            platform: win32
            arches: x64
            cmd: pack:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Fetch bundled binaries
        shell: bash
        run: for a in ${{ matrix.arches }}; do node scripts/fetch-binaries.mjs --platform ${{ matrix.platform }} --arch $a; done
      - name: Smoke test the renderer
        if: matrix.os == 'macos-latest'
        run: |
          # npm may skip Electron's postinstall, which downloads its binary.
          node node_modules/electron/install.js
          npm run smoke
      - run: npm run ${{ matrix.cmd }}
      - uses: actions/upload-artifact@v4
        with:
          name: blog-editor-${{ matrix.platform }}
          path: |
            release/*.dmg
            release/*.exe
            release/latest*.yml
