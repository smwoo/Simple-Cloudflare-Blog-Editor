name: build

on:
  push:
    branches: [main]
    # Pushing a tag like v0.1.1 builds both platforms and publishes a release.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      # The ffmpeg/Hugo tests need the real binaries, not whatever is on PATH.
      - run: node scripts/fetch-binaries.mjs
      # Media tests that need the reference library skip automatically; the
      # serializer and site tests always run.
      - run: npm test

  package:
    # Cross-compiling is a dead end here: Windows installers built on macOS hit
    # wine friction, and macOS notarization only runs on macOS. One job per host.
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin
            arches: arm64 x64
            cmd: pack:mac
          - os: windows-latest
            platform: win32
            arches: x64
            cmd: pack:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Fetch bundled binaries
        shell: bash
        run: for a in ${{ matrix.arches }}; do node scripts/fetch-binaries.mjs --platform ${{ matrix.platform }} --arch $a; done
      - name: Smoke test the renderer
        if: matrix.os == 'macos-latest'
        run: |
          # npm may skip Electron's postinstall, which downloads its binary.
          node node_modules/electron/install.js
          npm run smoke
      - run: npm run ${{ matrix.cmd }}
      - uses: actions/upload-artifact@v4
        with:
          name: blog-editor-${{ matrix.platform }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.blockmap
            release/latest*.yml

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed "s/<version>/$version/g" .github/release-notes.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --prerelease --title "$GITHUB_REF_NAME (preview)" --notes-file notes.md
