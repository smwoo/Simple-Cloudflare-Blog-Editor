appId: com.blogeditor.app
afterPack: scripts/adhoc-sign.cjs
productName: Blog Editor
directories:
  output: release
  buildResources: build

files:
  - out/**
  - package.json
  # sharp resolves its own @img/sharp-<platform> package at runtime, so the
  # native bindings must ship unpacked rather than inside the asar.
asarUnpack:
  - node_modules/sharp/**
  - node_modules/@img/**

extraResources:
  # The bundled binaries, fetched by scripts/fetch-binaries.mjs. Only the
  # current platform's directory is included.
  # Kept under bin/<platform>-<arch>/, which is where ffmpeg.ts and hugo.ts look.
  - from: resources/bin/${platform}-${arch}
    to: bin/${platform}-${arch}
  - from: resources/site-template
    to: site-template

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
  # Ad-hoc signed, not notarized. Without any signature electron-builder
  # leaves Electron's original one broken by its edits, and a downloaded copy on
  # Apple Silicon is reported as "damaged" with no way past it but Terminal.
  # Ad-hoc signing seals the bundle (bundled ffmpeg/Hugo included), so macOS
  # instead shows the unverified-developer warning, which System Settings →
  # Privacy & Security → "Open Anyway" clears once. Removing that warning needs
  # the $99/yr Apple Developer Program and notarization; see CODE-SIGNING.md.
  # null = electron-builder does not sign; scripts/adhoc-sign.cjs does (afterPack).
  identity: null
  # Hardened runtime only matters for notarization.
  hardenedRuntime: false
  gatekeeperAssess: false
  notarize: false

win:
  target:
    # x64 only: neither hugo_extended nor workerd publishes a windows-arm64
    # build, and Windows on ARM runs x64 under emulation.
    - target: nsis
      arch: [x64]
  # Unsigned. An OV certificate would not remove the SmartScreen warning at this
  # audience size, because reputation accrues through download volume a handful
  # of installs can never reach. Do the first install in person and rely on
  # electron-updater afterwards. See CODE-SIGNING.md.

dmg:
  artifactName: Blog-Editor-${version}-mac-${arch}.${ext}

nsis:
  artifactName: Blog-Editor-Setup-${version}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always

publish:
  # Updates come from this repo's GitHub Releases (latest.yml is attached by the
  # release job in .github/workflows/build.yml). Windows only for now: macOS will
  # only install an update whose signature matches the running app, and an
  # ad-hoc signature differs on every build.
  provider: github
  owner: smwoo
  repo: Simple-Cloudflare-Blog-Editor
